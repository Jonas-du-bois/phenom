# docker-compose.yml (Développement avec MongoDB Atlas)

services:
  # Backend API (connecté à MongoDB Atlas)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        NODE_ENV: development
    container_name: phenom-backend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # Environnement
      NODE_ENV: development
      PORT: 3000
      
      # MongoDB Atlas
      MONGODB_URI: ${MONGODB_URI}
      
      # Cloudinary
      CLOUDINARY_URL: ${CLOUDINARY_URL}
      
      # JWT
      JWT_SECRET: ${JWT_SECRET:-phenom-dev-secret-change-in-production-2025}
      JWT_EXPIRE: ${JWT_EXPIRE:-1h}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-phenom-dev-refresh-secret-change-in-production-2025}
      JWT_REFRESH_EXPIRE: ${JWT_REFRESH_EXPIRE:-7d}
      
      # CORS - Note: http://localhost (sans port) = port 80 implicite
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost:80,http://localhost,http://localhost:3000}
      
      # Rate Limiting
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
      
      # File Upload
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-10485760}
      ALLOWED_IMAGE_TYPES: ${ALLOWED_IMAGE_TYPES:-image/jpeg,image/png,image/webp}
      UPLOAD_DIR: ${UPLOAD_DIR:-uploads}
      
      # Image Compression
      IMAGE_QUALITY: ${IMAGE_QUALITY:-85}
      IMAGE_MAX_WIDTH: ${IMAGE_MAX_WIDTH:-1920}
      IMAGE_MAX_HEIGHT: ${IMAGE_MAX_HEIGHT:-1920}
      IMAGE_MAX_SIZE: ${IMAGE_MAX_SIZE:-10485760}
      
      # Pagination
      DEFAULT_PAGE_SIZE: ${DEFAULT_PAGE_SIZE:-10}
      MAX_PAGE_SIZE: ${MAX_PAGE_SIZE:-1000}
      
      # API
      API_PREFIX: ${API_PREFIX:-/api/v1}
      
      # Gemini AI
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    networks:
      - phenom-network
    volumes:
      - ./backend/src:/app/src
      - ./backend/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Vue.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
        VITE_API_PREFIX: ${VITE_API_PREFIX:-/api/v1}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:3000}
        VITE_APP_NAME: ${VITE_APP_NAME:-Phenom}
        VITE_MAP_TILES_URL: ${VITE_MAP_TILES_URL:-https://tile.openstreetmap.org/{z}/{x}/{y}.png}
    container_name: phenom-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - phenom-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  phenom-network:
    driver: bridge


